<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Custom GPT</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 로그인 모달 -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-card auth-card">
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="login">로그인</button>
                <button class="tab-btn" data-tab="signup">회원가입</button>
            </div>
            <div class="form-group">
                <label for="auth-id">아이디 (예: 하람)</label>
                <input type="text" id="auth-id" placeholder="아이디를 입력하세요">
            </div>
            <div class="form-group">
                <label for="auth-pw">비밀번호</label>
                <input type="password" id="auth-pw" placeholder="비밀번호를 입력하세요">
            </div>
            <button id="auth-submit-btn" class="btn-primary full-width">로그인</button>
            <button id="guest-login-btn" class="btn-secondary full-width" style="margin-top: 10px;">⚡ 로그인 없이 바로 시작하기</button>
        </div>
    </div>

    <!-- 메인 앱 컨테이너 -->
    <div class="app-container">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <button id="new-chat-btn" class="btn-primary">+ 새 채팅</button>
            <div class="chat-history-list" id="chat-history">
                <!-- 대화 세션 목록이 동적으로 생성됨 -->
            </div>
        </aside>

        <!-- 메인 채팅 영역 -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="header-left">
                    <h1 id="app-title">Custom GPT</h1>
                    <select id="model-select" class="model-select">
                        <option value="llama-3.3-70b-versatile">GPT-OSS 120B (최상급 성능)</option>
                        <option value="llama-3.1-8b-instant">GPT-OSS 20B (초고속)</option>
                    </select>
                </div>
                <div class="header-controls">
                    <span class="user-profile" id="user-display-name">👤 하람 님</span>
                    <button id="settings-btn" class="btn-secondary">환경 설정</button>
                    <button id="logout-btn" class="btn-danger">로그아웃</button>
                </div>
            </header>

            <!-- 채팅 메시지 표시 영역 -->
            <div class="chat-messages" id="chat-messages">
                <div class="message ai-message">
                    <div class="message-content">안녕하세요! 무엇을 도와드릴까요?</div>
                </div>
            </div>

            <!-- 하단 입력 영역 -->
            <div class="chat-input-area">
                <div class="input-wrapper">
                    <textarea id="prompt-input" placeholder="메시지 또는 링크(URL)를 입력하세요..." rows="1"></textarea>
                    <button id="send-btn" class="btn-send">전송</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 환경 설정 모달 -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-card settings-card">
            <h2>환경 설정</h2>
            <div class="form-group">
                <label>사이트 이름 (한글)</label>
                <input type="text" id="setting-title-ko" value="Custom GPT">
            </div>
            <div class="form-group">
                <label>사이트 이름 (영문)</label>
                <input type="text" id="setting-title-en" value="Custom GPT">
            </div>
            <div class="form-group">
                <label>🔑 Groq API Key 입력</label>
                <input type="password" id="api-key-input" placeholder="gsk_... 로 시작하는 키 입력">
            </div>
            <div class="form-group">
                <label>말투 설정</label>
                <select id="setting-tone" class="model-select" style="width:100%;">
                    <option value="polite">친절하고 정중한 존댓말 (기본)</option>
                    <option value="friendly">친근하고 편안한 반말/친구투</option>
                    <option value="professional">전문적이고 간결한 비즈니스 톤</option>
                </select>
            </div>
            <div class="modal-buttons">
                <button id="save-settings-btn" class="btn-primary">저장 및 닫기</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
