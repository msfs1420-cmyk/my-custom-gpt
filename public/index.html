<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom GPT (Groq AI Powered)</title>
  <style>
    :root {
      --bg-color: #0f141d;
      --card-bg: #1d2636;
      --sidebar-bg: #151d2a;
      --sidebar-hover: #222d40;
      --sidebar-active: #007bd3;
      --card-border: #2a364f;
      --input-bg: #111827;
      --input-text: #ffffff;
      --text-color: #e2e8f0;
      --text-sub: #94a3b8;
      --primary-color: #007bd3;
      --primary-hover: #0063ab;
      --modal-overlay: rgba(0, 0, 0, 0.85);
      --error-color: #ef4444;
      --user-msg-bg: #007bd3;
      --gpt-msg-bg: #273349;
    }

    [data-theme="light"] {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --sidebar-bg: #e2e8f0;
      --sidebar-hover: #cbd5e1;
      --sidebar-active: #007bd3;
      --card-border: #cbd5e1;
      --input-bg: #ffffff;
      --input-text: #0f172a;
      --text-color: #0f172a;
      --text-sub: #64748b;
      --modal-overlay: rgba(0, 0, 0, 0.5);
      --user-msg-bg: #007bd3;
      --gpt-msg-bg: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color 0.2s, color 0.2s;
    }

    header {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    header h1 {
      font-size: 1.2rem;
      color: #38bdf8;
      font-weight: 700;
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.9rem;
      transition: all 0.2s;
    }

    .btn:hover { opacity: 0.9; }

    .btn-primary { background-color: var(--primary-color); color: white; }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #334155; color: white; }
    .btn-secondary:hover { background-color: #475569; }
    .btn-danger { background-color: #ef4444; color: white; }
    .btn-danger:hover { background-color: #dc2626; }
    .btn-block { width: 100%; padding: 12px; font-size: 1rem; margin-top: 6px; }

    .app-container {
      flex: 1;
      display: flex;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    .sidebar {
      width: 260px;
      background-color: var(--sidebar-bg);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      padding: 15px;
      gap: 12px;
    }

    .session-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .session-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.88rem;
      background-color: transparent;
      color: var(--text-color);
      transition: background 0.2s;
    }

    .session-item:hover { background-color: var(--sidebar-hover); }
    .session-item.active { background-color: var(--sidebar-active); color: white; font-weight: bold; }

    .session-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 170px;
    }

    .btn-delete-session {
      background: none;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 4px;
      border-radius: 4px;
      opacity: 0.7;
    }

    .btn-delete-session:hover { opacity: 1; color: #ef4444; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      height: 100%;
    }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .chat-message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .chat-message.user {
      align-self: flex-end;
      background-color: var(--user-msg-bg);
      color: white;
      border-bottom-right-radius: 2px;
    }

    .chat-message.gpt {
      align-self: flex-start;
      background-color: var(--gpt-msg-bg);
      color: var(--text-color);
      border-bottom-left-radius: 2px;
    }

    .file-attachment {
      margin-top: 8px;
      padding: 6px 10px;
      background: rgba(0, 0, 0, 0.15);
      border-radius: 6px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .input-container {
      margin-top: 15px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    textarea {
      flex: 1;
      background-color: var(--input-bg);
      color: var(--input-text);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px;
      resize: none;
      height: 50px;
      outline: none;
      font-size: 0.95rem;
    }

    .file-preview-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .file-preview-item {
      background: var(--input-bg);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--card-border);
    }

    .file-preview-item button {
      background: none;
      border: none;
      color: #ef4444;
      cursor: pointer;
      font-weight: bold;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--modal-overlay);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 99999;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      width: 420px;
      padding: 28px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-card h2 {
      font-size: 1.3rem;
      color: #38bdf8;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .auth-tabs {
      display: flex;
      border-bottom: 2px solid var(--card-border);
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: var(--text-sub);
      padding: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
    }

    .tab-btn.active { color: #38bdf8; border-bottom-color: #38bdf8; }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .form-group label {
      font-size: 0.88rem;
      color: var(--text-color);
      font-weight: 600;
    }

    .form-control {
      background-color: var(--input-bg);
      color: var(--input-text);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 12px;
      outline: none;
      font-size: 0.95rem;
      width: 100%;
    }

    .form-control:focus { border-color: #38bdf8; }
    select.form-control { cursor: pointer; }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .modal-buttons .btn { flex: 1; padding: 12px; }

    .error-box {
      color: var(--error-color);
      background-color: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.88rem;
      text-align: center;
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="header-left">
      <h1 id="site-title-display">Custom GPT</h1>

      <select id="header-model-select" class="form-control" style="width: auto; padding: 6px 12px;">
        <option value="openai/gpt-oss-20b">GPT-OSS 20B (초고속 추천)</option>
        <option value="openai/gpt-oss-120b">GPT-OSS 120B (최상급 성능)</option>
      </select>
    </div>

    <div class="header-actions">
      <span id="user-info-tag" style="font-size:0.9rem; color:var(--text-sub);"></span>
      <button type="button" class="btn btn-secondary" id="btn-open-settings">환경 설정</button>
      <button type="button" class="btn btn-danger" id="btn-logout">로그아웃</button>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <div class="app-container">
    <aside class="sidebar">
      <button type="button" id="btn-new-chat" class="btn btn-primary btn-block">➕ 새 채팅</button>
      <div id="session-list" class="session-list"></div>
    </aside>

    <main>
      <div id="chat-box"></div>

      <div class="input-container">
        <div id="file-preview-container" class="file-preview-list"></div>
        <div class="input-row">
          <label for="file-upload" class="btn btn-secondary" style="display:flex; align-items:center; cursor:pointer;" title="파일 업로드">
            📁
          </label>
          <input type="file" id="file-upload" multiple style="display:none;">
          <textarea id="user-input" placeholder="메시지 또는 링크(URL)를 입력하세요..."></textarea>
          <button type="button" id="btn-send" class="btn btn-primary">전송</button>
        </div>
      </div>
    </main>
  </div>

  <!-- 1. 로그인 / 회원가입 모달 -->
  <div id="login-modal" class="modal-overlay">
    <div class="modal-card">
      <div class="auth-tabs">
        <button type="button" id="tab-login" class="tab-btn active">로그인</button>
        <button type="button" id="tab-register" class="tab-btn">회원가입</button>
      </div>

      <div id="login-error-msg" class="error-box"></div>

      <div class="form-group">
        <input type="text" id="login-username" class="form-control" placeholder="아이디 (예: 하람)">
        <input type="password" id="login-password" class="form-control" placeholder="비밀번호">
        <input type="password" id="login-password-confirm" class="form-control hidden" placeholder="비밀번호 확인">
      </div>

      <button type="button" id="btn-auth-submit" class="btn btn-primary btn-block">로그인</button>
      <button type="button" id="btn-guest" class="btn btn-secondary btn-block">⚡ 로그인 없이 바로 시작하기</button>
    </div>
  </div>

  <!-- 2. 환경 설정 모달 -->
  <div id="settings-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h2 id="modal-settings-title">환경 설정</h2>
      
      <div class="form-group">
        <label id="lbl-site-ko">사이트 이름 (한글)</label>
        <input type="text" id="setting-site-ko" class="form-control" value="Custom GPT">
      </div>

      <div class="form-group">
        <label id="lbl-site-en">사이트 이름 (영문)</label>
        <input type="text" id="setting-site-en" class="form-control" value="Custom GPT">
      </div>

      <div class="form-group">
        <label>🔑 Groq API Key 입력</label>
        <input type="password" id="setting-apikey" class="form-control" placeholder="gsk_... 로 시작하는 키 입력">
      </div>

      <div class="form-group">
        <label id="lbl-model">AI 모델 선택</label>
        <select id="setting-model" class="form-control">
          <option value="openai/gpt-oss-20b">GPT-OSS 20B (초고속)</option>
          <option value="openai/gpt-oss-120b">GPT-OSS 120B (최상급)</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lbl-tone">말투 설정</label>
        <select id="setting-tone" class="form-control">
          <option value="polite">친절하고 정중한 존댓말 (기본)</option>
          <option value="business">전문적이고 격식있는 비즈니스 모드</option>
          <option value="friendly">상냥하고 다정한 메이트 모드</option>
          <option value="witty">재치있고 솔직한 모드</option>
          <option value="concise">간결하고 핵심만 말하는 모드</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lbl-ui-lang">GPT UI 표시 언어</label>
        <select id="setting-ui-lang" class="form-control">
          <option value="ko">한국어</option>
          <option value="en">English</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lbl-gpt-lang">GPT 답장 언어</label>
        <select id="setting-gpt-lang" class="form-control">
          <option value="ko">한국어 (Korean)</option>
          <option value="en">English (영어)</option>
          <option value="ja">日本語 (일본어)</option>
          <option value="zh">中文 (중국어)</option>
          <option value="es">Español (스페인어)</option>
          <option value="fr">Français (프랑스어)</option>
          <option value="de">Deutsch (독일어)</option>
        </select>
      </div>

      <div class="form-group">
        <label id="lbl-theme">테마 선택</label>
        <select id="setting-theme" class="form-control">
          <option value="dark">다크 테마 (기본)</option>
          <option value="light">라이트 테마</option>
        </select>
      </div>

      <div class="modal-buttons">
        <button type="button" id="btn-save-settings" class="btn btn-primary">저장 및 닫기</button>
      </div>
    </div>
  </div>

  <!-- 3. 로그아웃 모달 -->
  <div id="logout-modal" class="modal-overlay hidden">
    <div class="modal-card" style="text-align: center;">
      <h2 style="color:#ef4444;" id="logout-modal-title">경고</h2>
      <p style="font-size: 1.05rem; margin: 10px 0;" id="logout-modal-prompt">로그아웃 하실건가요?</p>
      <div class="modal-buttons">
        <button type="button" id="btn-logout-confirm" class="btn btn-danger">네</button>
        <button type="button" id="btn-logout-cancel" class="btn btn-secondary">아니요</button>
      </div>
    </div>
  </div>

  <script>
    (function() {
      const DEFAULT_API_KEY = "";

      const i18n = {
        ko: {
          settings: "환경 설정",
          logout: "로그아웃",
          newChat: "➕ 새 채팅",
          send: "전송",
          placeholder: "메시지 또는 링크(URL)를 입력하세요...",
          siteKo: "사이트 이름 (한글)",
          siteEn: "사이트 이름 (영문)",
          lblModel: "AI 모델 선택",
          lblTone: "말투 설정",
          lblUiLang: "GPT UI 표시 언어",
          lblGptLang: "GPT 답장 언어",
          lblTheme: "테마 선택",
          saveClose: "저장 및 닫기",
          logoutTitle: "경고",
          logoutPrompt: "로그아웃 하실건가요?",
          guestName: "게스트"
        },
        en: {
          settings: "Settings",
          logout: "Logout",
          newChat: "➕ New Chat",
          send: "Send",
          placeholder: "Type a message or paste a link (URL)...",
          siteKo: "Site Name (Korean)",
          siteEn: "Site Name (English)",
          lblModel: "Select AI Model",
          lblTone: "Tone & Persona",
          lblUiLang: "GPT UI Display Language",
          lblGptLang: "GPT Response Language",
          lblTheme: "Theme Selection",
          saveClose: "Save & Close",
          logoutTitle: "Warning",
          logoutPrompt: "Are you sure you want to log out?",
          guestName: "Guest"
        }
      };

      const memoryStorage = {};
      function getData(key) {
        try { return localStorage.getItem(key); } catch(e) { return memoryStorage[key] || null; }
      }
      function setData(key, val) {
        try { localStorage.setItem(key, val); } catch(e) { memoryStorage[key] = val; }
      }
      function removeData(key) {
        try { localStorage.removeItem(key); } catch(e) { delete memoryStorage[key]; }
      }

      const loginModal = document.getElementById('login-modal');
      const settingsModal = document.getElementById('settings-modal');
      const logoutModal = document.getElementById('logout-modal');
      
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const usernameInput = document.getElementById('login-username');
      const passwordInput = document.getElementById('login-password');
      const confirmPwInput = document.getElementById('login-password-confirm');
      const submitBtn = document.getElementById('btn-auth-submit');
      const guestBtn = document.getElementById('btn-guest');
      const errorBox = document.getElementById('login-error-msg');
      
      const userInfoTag = document.getElementById('user-info-tag');
      const logoutBtn = document.getElementById('btn-logout');
      const logoutConfirmBtn = document.getElementById('btn-logout-confirm');
      const logoutCancelBtn = document.getElementById('btn-logout-cancel');
      
      const openSettingsBtn = document.getElementById('btn-open-settings');
      const saveSettingsBtn = document.getElementById('btn-save-settings');
      
      const newChatBtn = document.getElementById('btn-new-chat');
      const sessionListEl = document.getElementById('session-list');
      const chatBox = document.getElementById('chat-box');
      const userInput = document.getElementById('user-input');
      const sendBtn = document.getElementById('btn-send');
      const fileInput = document.getElementById('file-upload');
      const filePreviewContainer = document.getElementById('file-preview-container');
      
      const headerModelSelect = document.getElementById('header-model-select');
      const settingModelSelect = document.getElementById('setting-model');
      const settingApiKeyInput = document.getElementById('setting-apikey');

      let authMode = 'login';
      let currentUser = null;
      let currentSessionId = null;
      let selectedFiles = [];

      let guestSettings = {
        siteKo: "Custom GPT",
        siteEn: "Custom GPT",
        apiKey: DEFAULT_API_KEY,
        model: "openai/gpt-oss-20b",
        tone: "polite",
        uiLang: "ko",
        gptLang: "ko",
        theme: "dark"
      };

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = 'block';
      }

      function clearError() {
        errorBox.textContent = '';
        errorBox.style.display = 'none';
      }

      function setAuthMode(mode) {
        authMode = mode;
        clearError();
        if (mode === 'login') {
          tabLogin.classList.add('active');
          tabRegister.classList.remove('active');
          confirmPwInput.classList.add('hidden');
          submitBtn.textContent = '로그인';
        } else {
          tabRegister.classList.add('active');
          tabLogin.classList.remove('active');
          confirmPwInput.classList.remove('hidden');
          submitBtn.textContent = '회원가입 완료';
        }
      }

      function login(username) {
        currentUser = username;
        setData('activeUser', username);
        loginModal.style.display = 'none';
        userInfoTag.textContent = `👤 ${username} 님`;
        loadUserDataAndHistory();
      }

      function handleSubmit() {
        clearError();
        const u = usernameInput.value.trim();
        const p = passwordInput.value;

        if (!u || !p) {
          showError("⚠️ 아이디와 비밀번호를 모두 입력해 주세요.");
          return;
        }

        if (authMode === 'login') {
          const stored = getData('user_' + u);
          if (!stored) {
            showError("❌ 존재하지 않는 아이디입니다. 상단 '회원가입' 탭을 눌러 가입해 주세요.");
            return;
          }
          try {
            const userObj = JSON.parse(stored);
            if (userObj.password !== p) {
              showError("❌ 비밀번호가 올바르지 않습니다.");
              return;
            }
            login(u);
          } catch(e) {
            showError("❌ 계정 데이터 오류가 발생했습니다.");
          }
        } else {
          const cp = confirmPwInput.value;
          if (p !== cp) {
            showError("❌ 비밀번호 확인이 일치하지 않습니다.");
            return;
          }
          if (getData('user_' + u)) {
            showError("❌ 이미 존재하는 아이디입니다.");
            return;
          }

          const initSessionId = "session_" + Date.now();
          const newUserObj = {
            username: u,
            password: p,
            currentSessionId: initSessionId,
            sessions: [{ id: initSessionId, title: "새 대화", chatHistory: [] }],
            settings: { ...guestSettings }
          };

          setData('user_' + u, JSON.stringify(newUserObj));
          alert("🎉 회원가입이 완료되었습니다!");
          login(u);
        }
      }

      function handleGuest() {
        login('게스트');
      }

      function handleLogoutExecute() {
        removeData('activeUser');
        currentUser = null;
        chatBox.innerHTML = '';
        usernameInput.value = '';
        passwordInput.value = '';
        confirmPwInput.value = '';
        clearError();
        setAuthMode('login');
        logoutModal.classList.add('hidden');
        loginModal.style.display = 'flex';
      }

      function getCurrentSettings() {
        if (!currentUser || currentUser === '게스트') {
          return guestSettings;
        }
        const raw = getData('user_' + currentUser);
        if (!raw) return guestSettings;
        try {
          const userData = JSON.parse(raw);
          return userData.settings || guestSettings;
        } catch(e) {
          return guestSettings;
        }
      }

      function applySettingsUI(settings) {
        if (!settings) settings = getCurrentSettings();
        const lang = settings.uiLang || 'ko';
        const dict = i18n[lang] || i18n.ko;

        if (settings.theme === 'light') {
          document.body.setAttribute('data-theme', 'light');
        } else {
          document.body.removeAttribute('data-theme');
        }

        const siteTitle = (lang === 'ko') ? (settings.siteKo || "Custom GPT") : (settings.siteEn || "Custom GPT");
        document.getElementById('site-title-display').textContent = siteTitle;
        openSettingsBtn.textContent = dict.settings;
        logoutBtn.textContent = dict.logout;
        newChatBtn.textContent = dict.newChat;
        sendBtn.textContent = dict.send;
        userInput.placeholder = dict.placeholder;

        document.getElementById('modal-settings-title').textContent = dict.settings;
        document.getElementById('lbl-site-ko').textContent = dict.siteKo;
        document.getElementById('lbl-site-en').textContent = dict.siteEn;
        document.getElementById('lbl-model').textContent = dict.lblModel;
        document.getElementById('lbl-tone').textContent = dict.lblTone;
        document.getElementById('lbl-ui-lang').textContent = dict.lblUiLang;
        document.getElementById('lbl-gpt-lang').textContent = dict.lblGptLang;
        document.getElementById('lbl-theme').textContent = dict.lblTheme;
        saveSettingsBtn.textContent = dict.saveClose;

        document.getElementById('logout-modal-title').textContent = dict.logoutTitle;
        document.getElementById('logout-modal-prompt').textContent = dict.logoutPrompt;

        let mVal = settings.model || "openai/gpt-oss-20b";
        if (mVal !== "openai/gpt-oss-20b" && mVal !== "openai/gpt-oss-120b") {
          mVal = "openai/gpt-oss-20b";
        }

        headerModelSelect.value = mVal;
        settingModelSelect.value = mVal;

        document.getElementById('setting-site-ko').value = settings.siteKo || "Custom GPT";
        document.getElementById('setting-site-en').value = settings.siteEn || "Custom GPT";
        settingApiKeyInput.value = settings.apiKey || DEFAULT_API_KEY;
        document.getElementById('setting-tone').value = settings.tone || "polite";
        document.getElementById('setting-ui-lang').value = settings.uiLang || "ko";
        document.getElementById('setting-gpt-lang').value = settings.gptLang || "ko";
        document.getElementById('setting-theme').value = settings.theme || "dark";
      }

      function loadUserDataAndHistory() {
        if (!currentUser || currentUser === '게스트') {
          sessionListEl.innerHTML = '';
          chatBox.innerHTML = '';
          applySettingsUI(guestSettings);
          return;
        }

        const raw = getData('user_' + currentUser);
        if (!raw) return;

        try {
          const userData = JSON.parse(raw);

          if (!userData.sessions) {
            const legacyId = "session_legacy";
            userData.sessions = [{ id: legacyId, title: "기존 대화", chatHistory: userData.history || [] }];
            userData.currentSessionId = legacyId;
            setData('user_' + currentUser, JSON.stringify(userData));
          }

          if (!userData.settings) {
            userData.settings = { ...guestSettings };
            setData('user_' + currentUser, JSON.stringify(userData));
          }

          applySettingsUI(userData.settings);

          currentSessionId = userData.currentSessionId || userData.sessions[0].id;
          renderSessionSidebar();
          renderCurrentChatHistory();
        } catch(e) {}
      }

      function renderSessionSidebar() {
        if (!currentUser || currentUser === '게스트') return;
        const raw = getData('user_' + currentUser);
        if (!raw) return;
        const userData = JSON.parse(raw);

        sessionListEl.innerHTML = '';
        (userData.sessions || []).forEach(sess => {
          const item = document.createElement('div');
          item.className = `session-item ${sess.id === currentSessionId ? 'active' : ''}`;
          item.onclick = () => switchSession(sess.id);

          item.innerHTML = `
            <span class="session-title">💬 ${escapeHtml(sess.title)}</span>
            <button class="btn-delete-session" title="삭제">🗑️</button>
          `;

          item.querySelector('.btn-delete-session').onclick = (e) => {
            e.stopPropagation();
            deleteSession(sess.id);
          };

          sessionListEl.appendChild(item);
        });
      }

      function switchSession(sessId) {
        currentSessionId = sessId;
        const raw = getData('user_' + currentUser);
        if (raw) {
          const userData = JSON.parse(raw);
          userData.currentSessionId = sessId;
          setData('user_' + currentUser, JSON.stringify(userData));
        }
        renderSessionSidebar();
        renderCurrentChatHistory();
      }

      function createNewSession() {
        if (!currentUser || currentUser === '게스트') {
          chatBox.innerHTML = '';
          return;
        }

        const raw = getData('user_' + currentUser);
        if (!raw) return;
        const userData = JSON.parse(raw);

        const newId = "session_" + Date.now();
        const newSess = { id: newId, title: "새 대화", chatHistory: [] };

        if (!userData.sessions) userData.sessions = [];
        userData.sessions.unshift(newSess);
        userData.currentSessionId = newId;

        setData('user_' + currentUser, JSON.stringify(userData));
        switchSession(newId);
      }

      function deleteSession(sessId) {
        const raw = getData('user_' + currentUser);
        if (!raw) return;
        const userData = JSON.parse(raw);

        if (userData.sessions.length <= 1) {
          alert("최소 하나의 대화 세션은 유지되어야 합니다.");
          return;
        }

        if (!confirm("이 대화 세션을 삭제하시겠습니까?")) return;

        userData.sessions = userData.sessions.filter(s => s.id !== sessId);
        if (currentSessionId === sessId) {
          currentSessionId = userData.sessions[0].id;
          userData.currentSessionId = currentSessionId;
        }

        setData('user_' + currentUser, JSON.stringify(userData));
        renderSessionSidebar();
        renderCurrentChatHistory();
      }

      function renderCurrentChatHistory() {
        chatBox.innerHTML = '';
        if (!currentUser || currentUser === '게스트') return;

        const raw = getData('user_' + currentUser);
        if (!raw) return;
        const userData = JSON.parse(raw);
        const sess = (userData.sessions || []).find(s => s.id === currentSessionId);

        if (sess && sess.chatHistory) {
          sess.chatHistory.forEach(msg => renderMsg(msg.sender, msg.text, msg.files));
        }
      }

      function renderMsg(sender, text, files = []) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `chat-message ${sender}`;

        let content = `<div>${escapeHtml(text).replace(/\n/g, '<br>')}</div>`;
        if (files && files.length > 0) {
          files.forEach(f => {
            content += `<div class="file-attachment">📄 ${escapeHtml(f.name)} (${f.size})</div>`;
          });
        }

        msgDiv.innerHTML = content;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
      }

      function saveChatHistory(sender, text, files = []) {
        if (!currentUser || currentUser === '게스트') return;

        const raw = getData('user_' + currentUser);
        if (!raw) return;
        const userData = JSON.parse(raw);
        const sess = (userData.sessions || []).find(s => s.id === currentSessionId);

        if (sess) {
          if (!sess.chatHistory) sess.chatHistory = [];
          sess.chatHistory.push({ sender, text, files, timestamp: new Date().toISOString() });
          
          if (sess.title === "새 대화" && sender === 'user' && text) {
            sess.title = text.length > 15 ? text.substring(0, 15) + "..." : text;
            renderSessionSidebar();
          }

          setData('user_' + currentUser, JSON.stringify(userData));
        }
      }

      /* ----------------------------------------------------
         Groq Cloud API 통신 함수
      ---------------------------------------------------- */
      async function sendMsg() {
        const text = userInput.value.trim();
        if (!text && selectedFiles.length === 0) return;

        const fileDataList = selectedFiles.map(f => ({ name: f.name, size: (f.size / (1024 * 1024)).toFixed(1) + 'MB' }));

        renderMsg('user', text, fileDataList);
        saveChatHistory('user', text, fileDataList);

        userInput.value = '';
        selectedFiles = [];
        renderFilePreviews();

        const loadingDiv = renderMsg('gpt', '⏳ Groq AI 답변 생성 중...');

        try {
          const reply = await callGroqAPI(text, fileDataList);
          loadingDiv.innerHTML = `<div>${escapeHtml(reply).replace(/\n/g, '<br>')}</div>`;
          saveChatHistory('gpt', reply);
        } catch(err) {
          const errText = `⚠️ [Groq API 오류]: ${err.message}`;
          loadingDiv.innerHTML = `<div style="color:#ef4444;">${escapeHtml(errText)}</div>`;
          saveChatHistory('gpt', errText);
        }
      }

      async function callGroqAPI(userText, files) {
        const settings = getCurrentSettings();

        const apiKey = (settings.apiKey && settings.apiKey.trim() !== "") ? settings.apiKey.trim() : DEFAULT_API_KEY;
        let model = headerModelSelect.value || settings.model || "openai/gpt-oss-20b";
        
        if (model !== "openai/gpt-oss-20b" && model !== "openai/gpt-oss-120b") {
          model = "openai/gpt-oss-20b";
        }

        const tone = settings.tone || "polite";
        const gptLang = settings.gptLang || "ko";

        let tonePrompt = "";
        switch (tone) {
          case 'business': tonePrompt = "당신은 격식 있고 전문적인 비즈니스 스타일로 답변합니다."; break;
          case 'friendly': tonePrompt = "당신은 상냥하고 다정한 친구 모드로 답변합니다."; break;
          case 'witty': tonePrompt = "당신은 재치 있고 위트 넘치게 답변합니다."; break;
          case 'concise': tonePrompt = "당신은 핵심만 간결하게 답변합니다."; break;
          default: tonePrompt = "당신은 친절하고 정중한 존댓말로 답변합니다.";
        }

        const langMap = {
          ko: "Korean (한국어)",
          en: "English (영어)",
          ja: "Japanese (日本語)",
          zh: "Chinese (中文)",
          es: "Spanish (Español)",
          fr: "French (Français)",
          de: "German (Deutsch)"
        };
        const targetLangName = langMap[gptLang] || "Korean (한국어)";
        let langPrompt = `[CRITICAL RULE]: You MUST write your ENTIRE response in ${targetLangName}. Do NOT answer in any other language.`;

        let fileInfo = files.length > 0 ? `\n[첨부파일]: ${files.map(f => f.name).join(', ')}` : "";
        const systemPrompt = `${tonePrompt}\n${langPrompt}`;

        const apiMessages = [{ role: "system", content: systemPrompt }];

        if (currentUser && currentUser !== '게스트') {
          const raw = getData('user_' + currentUser);
          if (raw) {
            const userData = JSON.parse(raw);
            const currentSess = (userData.sessions || []).find(s => s.id === currentSessionId);
            if (currentSess && currentSess.chatHistory) {
              currentSess.chatHistory.slice(-6).forEach(msg => {
                apiMessages.push({
                  role: msg.sender === 'user' ? 'user' : 'assistant',
                  content: msg.text
                });
              });
            }
          }
        }

        apiMessages.push({ role: "user", content: userText + fileInfo });

        const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: model,
            messages: apiMessages,
            temperature: 0.7,
            max_tokens: 2048
          })
        });

        if (!response.ok) {
          const errJson = await response.json().catch(() => ({}));
          throw new Error(errJson.error?.message || `Groq API 요청 실패 (${response.status})`);
        }

        const data = await response.json();
        return data.choices[0].message.content;
      }

      /* ----------------------------------------------------
         파일 업로드
      ---------------------------------------------------- */
      fileInput.onchange = function(e) {
        const files = Array.from(e.target.files);
        const maxLimit = 500 * 1024 * 1024;

        files.forEach(f => {
          if (f.size > maxLimit) {
            alert(`[용량 초과] ${f.name} 은(는) 500MB를 초과하여 업로드할 수 없습니다.`);
            return;
          }
          selectedFiles.push(f);
        });

        renderFilePreviews();
      };

      function renderFilePreviews() {
        filePreviewContainer.innerHTML = '';
        selectedFiles.forEach((file, index) => {
          const item = document.createElement('div');
          item.className = 'file-preview-item';
          item.innerHTML = `
            <span>📎 ${escapeHtml(file.name)} (${(file.size / (1024 * 1024)).toFixed(1)}MB)</span>
            <button type="button">✕</button>
          `;
          item.querySelector('button').onclick = () => {
            selectedFiles.splice(index, 1);
            renderFilePreviews();
          };
          filePreviewContainer.appendChild(item);
        });
      }

      /* ----------------------------------------------------
         이벤트 바인딩
      ---------------------------------------------------- */
      tabLogin.onclick = function() { setAuthMode('login'); };
      tabRegister.onclick = function() { setAuthMode('register'); };
      submitBtn.onclick = handleSubmit;
      guestBtn.onclick = handleGuest;
      
      logoutBtn.onclick = function() { logoutModal.classList.remove('hidden'); };
      logoutConfirmBtn.onclick = handleLogoutExecute;
      logoutCancelBtn.onclick = function() { logoutModal.classList.add('hidden'); };
      
      openSettingsBtn.onclick = function() {
        applySettingsUI();
        settingsModal.classList.remove('hidden');
      };

      saveSettingsBtn.onclick = function() {
        const updatedSettings = {
          siteKo: document.getElementById('setting-site-ko').value,
          siteEn: document.getElementById('setting-site-en').value,
          apiKey: settingApiKeyInput.value.trim(),
          model: settingModelSelect.value,
          tone: document.getElementById('setting-tone').value,
          uiLang: document.getElementById('setting-ui-lang').value,
          gptLang: document.getElementById('setting-gpt-lang').value,
          theme: document.getElementById('setting-theme').value
        };

        if (currentUser && currentUser !== '게스트') {
          const raw = getData('user_' + currentUser);
          if (raw) {
            const userData = JSON.parse(raw);
            userData.settings = updatedSettings;
            setData('user_' + currentUser, JSON.stringify(userData));
          }
        } else {
          guestSettings = updatedSettings;
        }

        applySettingsUI(updatedSettings);
        settingsModal.classList.add('hidden');
      };

      headerModelSelect.onchange = function() {
        const newModel = headerModelSelect.value;
        settingModelSelect.value = newModel;

        if (currentUser && currentUser !== '게스트') {
          const raw = getData('user_' + currentUser);
          if (raw) {
            const userData = JSON.parse(raw);
            if (!userData.settings) userData.settings = {};
            userData.settings.model = newModel;
            setData('user_' + currentUser, JSON.stringify(userData));
          }
        } else {
          guestSettings.model = newModel;
        }
      };

      newChatBtn.onclick = createNewSession;
      sendBtn.onclick = sendMsg;

      userInput.onkeydown = function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          sendMsg();
        }
      };

      const handleEnterAuth = function(e) {
        if (e.key === 'Enter') handleSubmit();
      };
      usernameInput.onkeydown = handleEnterAuth;
      passwordInput.onkeydown = handleEnterAuth;
      confirmPwInput.onkeydown = handleEnterAuth;

      function escapeHtml(str) {
        return str ? String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") : '';
      }

      const activeUser = getData('activeUser');
      if (activeUser) {
        login(activeUser);
      } else {
        applySettingsUI(guestSettings);
      }
    })();
  </script>
</body>
</html>
