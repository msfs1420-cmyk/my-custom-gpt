<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom GPT - Vision & Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- 사이드바 -->
        <aside class="sidebar">
            <button id="new-chat-btn" class="btn-primary">+ 새 채팅</button>
            <div class="chat-history-list" id="chat-history">
                <!-- 대화 기록 목록 -->
            </div>
        </aside>

        <!-- 메인 채팅 영역 -->
        <main class="chat-main">
            <header class="chat-header">
                <h1 id="app-title">Custom GPT</h1>
                <div class="header-controls">
                    <!-- 모델 선택 드롭다운 (Vision 모델 포함) -->
                    <select id="model-select" class="model-select">
                        <option value="llama-3.2-11b-vision-preview">Llama 3.2 Vision (이미지 분석)</option>
                        <option value="llama-3.2-90b-vision-preview">Llama 3.2 90B Vision (고성능 이미지 분석)</option>
                        <option value="llama-3.1-70b-versatile">Llama 3.1 70B (텍스트 전용)</option>
                    </select>
                    <button id="settings-btn" class="btn-secondary">환경 설정</button>
                </div>
            </header>

            <!-- 채팅 메시지 표시 영역 -->
            <div class="chat-messages" id="chat-messages">
                <div class="message ai-message">
                    <div class="message-content">안녕하세요! 텍스트 대화와 이미지 분석이 모두 가능한 Custom GPT입니다. 무엇을 도와드릴까요?</div>
                </div>
            </div>

            <!-- 하단 입력 영역 -->
            <div class="chat-input-area">
                <!-- 이미지 미리보기 영역 -->
                <div id="image-preview-container" class="image-preview-container hidden">
                    <img id="image-preview" src="" alt="업로드 이미지 미리보기">
                    <button id="remove-image-btn" type="button">×</button>
                </div>

                <div class="input-wrapper">
                    <label for="image-file-input" class="file-upload-label" title="이미지 첨부">
                        📁
                    </label>
                    <input type="file" id="image-file-input" accept="image/*" class="hidden">
                    
                    <textarea id="prompt-input" placeholder="메시지 또는 링크(URL)를 입력하세요..." rows="1"></textarea>
                    <button id="send-btn" class="btn-send">전송</button>
                </div>
            </div>
        </main>
    </div>

    <!-- 환경 설정 모달 -->
    <div id="settings-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>환경 설정</h2>
            <div class="form-group">
                <label for="api-key-input">🔑 Groq API Key 입력</label>
                <input type="password" id="api-key-input" placeholder="gsk_... 로 시작하는 키 입력">
            </div>
            <div class="modal-buttons">
                <button id="save-settings-btn" class="btn-primary">저장 및 닫기</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
